[package]
name = "clama-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for the Clama ECS library."
license = "MIT OR Apache-2.0"
repository = "https://github.com/PsychoRosse/clama"

[lib]
proc-macro = true
path = "src/_lib.rs"

[dependencies]
proc-macro-crate = { version = "3" }
proc-macro2 = { version = "1.0" }
quote = { version = "1.0" }
syn = { version = "2.0", features = ["full"] }
